name: kiwi_app
description: Kiwi - Rends chaque moment éternel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0

  go_router: ^13.2.0

  flutter_riverpod: ^2.5.0

  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  image_picker: ^1.0.7
  image_cropper: 8.0.2
  video_player: ^2.8.3
  video_compress: ^3.1.2

  table_calendar: ^3.1.0

  intl: 0.20.2
  uuid: ^4.3.3
  share_plus: ^7.2.2
  permission_handler: ^11.3.0

  cupertino_icons: ^1.0.6
  http: ^1.6.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  shared_preferences: ^2.2.2
  timeago: ^3.7.1

  record: ^5.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/kiwi_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8BC34A"
  adaptive_icon_foreground: "assets/icon/kiwi_icon.png"

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/