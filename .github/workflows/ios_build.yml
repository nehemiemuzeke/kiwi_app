name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Dépendances Flutter
        run: flutter pub get

      - name: Installer Pods iOS
        run: |
          cd ios
          pod deinstall || true
          pod install --repo-update
          cd ..

      - name: Compiler iOS (Release)
        run: flutter build ios --release --no-codesign

      - name: Créer le fichier IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Kiwi.ipa Payload

      - name: Télécharger le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi-iPhone-IPA
          path: Kiwi.ipa
